<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>소중한 나의 꿈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* 레이아웃: A4 가로 용지 한 장. 위에 제목, 그 아래 왼쪽 그림 칸과 오른쪽 조사 두 칸이 같은 높이로 나란히 선다. 좁은 화면에서는 위아래로 쌓인다. */
:root {
  --sky: #E6F1FA;
  --paper: #FFFFFF;
  --tint: #F3F8FD;
  --ink: #17264A;
  --ink-soft: #55668A;
  --line: #C6D7EA;
  --sun: #FFC42E;
  --sun-ink: #17264A;
  --leaf: #17876A;
  --leaf-ink: #FFFFFF;
  --badge: #2456C8;
  --badge-ink: #FFFFFF;
  --warn: #B3381F;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --row: 40px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #0F1930; --paper: #1A2643; --tint: #141F3A; --ink: #EDF2FB; --ink-soft: #A6B4D0;
    --line: #34466E; --sun: #FFC42E; --sun-ink: #17264A; --leaf: #3FBF9A; --leaf-ink: #0B2A22;
    --badge: #3D6FE0; --badge-ink: #FFFFFF; --warn: #FF9480; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #0F1930; --paper: #1A2643; --tint: #141F3A; --ink: #EDF2FB; --ink-soft: #A6B4D0;
  --line: #34466E; --sun: #FFC42E; --sun-ink: #17264A; --leaf: #3FBF9A; --leaf-ink: #0B2A22;
  --badge: #3D6FE0; --badge-ink: #FFFFFF; --warn: #FF9480; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  padding-inline: 20px;
  padding-block: 20px 48px;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.wrap { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }

/* 안내와 버튼 */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
.lede { margin: 0; color: var(--ink-soft); min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

button { font: inherit; cursor: pointer; }
.btn {
  font-family: var(--font-display); font-size: 1.05rem; line-height: 1;
  padding: 12px 18px; border-radius: 999px; border: 2px solid var(--ink);
  background: var(--paper); color: var(--ink);
}
.btn-main { background: var(--sun); color: var(--sun-ink); border-color: var(--sun-ink); box-shadow: 0 3px 0 var(--sun-ink); }
.btn-main:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--sun-ink); }
.btn-quiet { border-color: var(--line); color: var(--ink-soft); }
.btn-small { font-size: .9rem; padding: 8px 13px; }
.btn:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 3px solid var(--badge); outline-offset: 2px; }

/* A4 가로 용지 */
.sheet {
  background: var(--paper); border: 2px solid var(--ink); border-radius: 20px;
  box-shadow: 0 6px 0 var(--line);
  padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 14px;
}
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.8rem, 3.6vw, 2.6rem); line-height: 1.15; margin: 0; text-align: center; text-wrap: balance; }
h1 span { background: linear-gradient(transparent 62%, var(--sun) 62%); padding-inline: 4px; }
.board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }

/* 왼쪽: 미래 나의 모습 */
.me { display: flex; flex-direction: column; min-width: 0; border: 2px solid var(--ink); border-radius: 18px; overflow: hidden; background: var(--tint); }
.me-head { background: var(--badge); color: var(--badge-ink); font-family: var(--font-display); font-size: 1.2rem; letter-spacing: .08em; text-align: center; padding: 10px 12px; }
.me-body { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
.photo-wrap { position: relative; aspect-ratio: 1 / 1; max-width: 100%; }
.photo {
  display: block; position: absolute; inset: 0;
  border-radius: 14px; border: 2px dashed var(--line); background: var(--paper);
  cursor: pointer; overflow: hidden;
}
.photo.over { border-color: var(--badge); border-style: solid; }
.photo.has-img { border-style: solid; border-color: var(--line); }
.photo:focus-within { outline: 3px solid var(--badge); outline-offset: 2px; }
.photo input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.photo-empty {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 16px; text-align: center; pointer-events: none;
}
.photo-empty svg { width: 40%; max-width: 180px; height: auto; }
.photo-empty .fig { fill: var(--line); }
.photo-empty .star { fill: var(--sun); }
.photo-empty strong { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; color: var(--ink); }
.photo-empty small { color: var(--ink-soft); font-size: .92rem; }
.photo-tools { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.who { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.line-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.line-field label { font-size: .9rem; color: var(--ink-soft); }
.line-field input {
  font-family: var(--font-display); font-size: 1.4rem; color: var(--ink); width: 100%; min-width: 0;
  background: transparent; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; padding: 0 2px 3px;
}
.line-field input:focus { outline: 0; border-bottom-color: var(--badge); }
.line-field input::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: .6; }

/* 오른쪽: 조사 두 칸 */
.notes { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.note { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.note-label {
  align-self: flex-start; font-family: var(--font-display); font-size: 1.25rem; line-height: 1.2;
  padding: 7px 18px; border-radius: 999px; background: var(--sun); color: var(--sun-ink);
}
.note.path .note-label { background: var(--leaf); color: var(--leaf-ink); }
textarea {
  font-family: var(--font-body); font-size: 1.2rem; line-height: var(--row); color: var(--ink);
  width: 100%; min-height: calc(var(--row) * 4 + 4px); resize: none; overflow: auto;
  padding: 0 18px; border: 2px solid var(--ink); border-radius: 18px;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(transparent 0, transparent calc(var(--row) - 1px), var(--line) calc(var(--row) - 1px), var(--line) var(--row));
  background-attachment: local;
}
textarea:focus { outline: 3px solid var(--badge); outline-offset: 2px; }

/* 넓은 화면(태블릿 가로): 용지를 A4 가로 비율로 고정하고 두 칸 높이를 맞춘다 */
@media (min-width: 900px) {
  .sheet { aspect-ratio: 297 / 210; }
  .board { flex: 1 1 auto; min-height: 0; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  .me, .notes { min-height: 0; }
  .me-body { flex: 1 1 auto; min-height: 0; }
  .photo-wrap { aspect-ratio: auto; flex: 1 1 auto; min-height: 0; }
  .note { flex: 1 1 0; min-height: 0; }
  textarea { flex: 1 1 auto; min-height: 0; }
}

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--ink-soft); font-size: .95rem; counter-reset: s; }
.steps li { display: flex; gap: 8px; align-items: baseline; counter-increment: s; min-width: 0; }
.steps li::before {
  content: counter(s); flex: none; font-family: var(--font-display); width: 1.6em; height: 1.6em; line-height: 1.6em;
  text-align: center; border-radius: 50%; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line);
}

/* 완성 카드 화면: 캡처해도 깔끔하도록 화면 전체를 덮는다 */
.done {
  position: fixed; inset: 0; z-index: 10; background: var(--sky); overflow: auto;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px));
}
.done-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; width: 100%; max-width: 1120px; }
.done-bar h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.2; margin: 0; }
.done-img { flex: 1 1 auto; min-height: 220px; width: 100%; display: flex; align-items: center; justify-content: center; }
.done-img img { display: block; max-width: 100%; max-height: 100%; }
.done-note { margin: 0; text-align: center; color: var(--ink-soft); }
.done-note:empty { display: none; }
.done-note.warn { color: var(--warn); }

.status { min-height: 1.6em; margin: 0; color: var(--ink-soft); font-size: .95rem; }
.status.warn { color: var(--warn); }
@media (prefers-reduced-motion: reduce) { .btn-main:active { transform: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <p class="lede">미래의 내 모습을 올리고, 그 직업을 조사해서 적어 보세요.</p>
    <div class="actions">
      <button type="button" class="btn btn-main" id="doneBtn">완성 카드 보기</button>
      <button type="button" class="btn btn-quiet" id="resetBtn">처음부터 다시</button>
      <span id="resetAsk" hidden>
        <button type="button" class="btn" id="resetYes">모두 지우기</button>
        <button type="button" class="btn btn-quiet" id="resetNo">취소</button>
      </span>
    </div>
  </header>

  <main class="sheet">
    <h1><span>소중한 나의 꿈</span></h1>
    <div class="board">
      <section class="me" aria-label="미래 나의 모습">
        <div class="me-head">미래 나의 모습</div>
        <div class="me-body">
          <div class="photo-wrap">
            <label class="photo" id="photo">
              <input type="file" id="photoInput" accept="image/*" aria-label="미래 나의 모습 그림 올리기">
              <span class="photo-empty" id="photoEmpty">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="fig" cx="60" cy="44" r="22"/>
                  <path class="fig" d="M18 112c0-24 18-38 42-38s42 14 42 38z"/>
                  <path class="star" d="M96 10l4.2 9.6 10.4 1-7.8 7 2.3 10.2L96 32.4l-9.1 5.4 2.3-10.2-7.8-7 10.4-1z"/>
                </svg>
                <strong>여기를 눌러 그림 올리기</strong>
                <small>제미나이로 만든 미래의 내 모습</small>
              </span>
              <img id="photoImg" alt="미래 나의 모습" hidden>
            </label>
            <div class="photo-tools" id="photoTools" hidden>
              <button type="button" class="btn btn-small" id="changeBtn">그림 바꾸기</button>
              <button type="button" class="btn btn-small btn-quiet" id="removeBtn">그림 지우기</button>
            </div>
          </div>
          <div class="who">
            <div class="line-field">
              <label for="jobName">미래의 직업</label>
              <input type="text" id="jobName" maxlength="20" placeholder="예) 수의사" autocomplete="off">
            </div>
            <div class="line-field">
              <label for="studentName">이름</label>
              <input type="text" id="studentName" maxlength="12" placeholder="내 이름" autocomplete="off">
            </div>
          </div>
        </div>
      </section>

      <section class="notes" aria-label="직업 조사">
        <div class="note work">
          <label class="note-label" for="jobWork">직업이 하는 일</label>
          <textarea id="jobWork" placeholder="이 직업을 가진 사람은 어떤 일을 하나요?&#10;예) 아픈 동물을 진찰하고 치료해요."></textarea>
        </div>
        <div class="note path">
          <label class="note-label" for="dreamPath">꿈을 이루기 위한 방법</label>
          <textarea id="dreamPath" placeholder="이 꿈을 이루려면 무엇을 하면 좋을까요?&#10;예) 동물에 관한 책을 많이 읽어요."></textarea>
        </div>
      </section>
    </div>
  </main>

  <ol class="steps">
    <li>내 사진을 찍어요.</li>
    <li>제미나이로 미래의 내 모습을 만들어요.</li>
    <li>만든 그림을 ‘미래 나의 모습’ 칸에 올려요.</li>
    <li>다 쓰면 ‘완성 카드 보기’를 눌러 이미지로 만들고, 패들렛에 올려요.</li>
  </ol>
  <p class="status" id="status" role="status" aria-live="polite">쓴 내용은 이 기기에 자동으로 저장돼요.</p>
</div>

<div class="done" id="done" hidden role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="done-bar">
    <h2 id="doneTitle">완성 카드</h2>
    <div class="actions">
      <button type="button" class="btn btn-main" id="saveBtn" hidden>이미지로 저장</button>
      <button type="button" class="btn" id="doneClose">돌아가서 고치기</button>
    </div>
  </div>
  <p class="done-note warn" id="doneMissing" hidden></p>
  <div class="done-img"><img id="doneImg" alt="완성한 소중한 나의 꿈 카드"></div>
  <p class="done-note" id="doneHelp"></p>
  <p class="done-note" id="doneStatus" role="status" aria-live="polite"></p>
</div>

<script>
(function () {
  var KEY = 'future-me-card-v1', IMG_KEY = 'future-me-card-img-v1';
  var $ = function (id) { return document.getElementById(id); };
  var ids = ['studentName', 'jobName', 'jobWork', 'dreamPath'];
  var photo = $('photo'), photoInput = $('photoInput'), photoImg = $('photoImg');
  var photoEmpty = $('photoEmpty'), photoTools = $('photoTools'), statusEl = $('status');
  var imgData = null, imgRatio = 1;
  /* 일반 웹사이트(깃허브 등)에서는 브라우저가 직접 내려받고, Claude 안에서는 저장 기능을 빌려 쓴다 */
  var STANDALONE = !(window.claude && typeof window.claude.use === 'function');
  var downloads = null;

  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function write(k, v) {
    try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; }
    catch (e) { return false; }
  }
  function setStatus(msg, warn) {
    statusEl.textContent = msg; statusEl.classList.toggle('warn', !!warn);
    var ds = $('doneStatus'); ds.textContent = msg; ds.classList.toggle('warn', !!warn);
  }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  /* ---- 글 ---- */
  function saveText() {
    var o = {};
    ids.forEach(function (id) { o[id] = $(id).value; });
    write(KEY, JSON.stringify(o));
  }
  (function restoreText() {
    var raw = read(KEY), o = null;
    try { o = raw ? JSON.parse(raw) : null; } catch (e) { o = null; }
    if (o) ids.forEach(function (id) { if (typeof o[id] === 'string' && !$(id).value) $(id).value = o[id]; });
  })();
  ids.forEach(function (id) { $(id).addEventListener('input', saveText); });

  /* ---- 그림 ---- */
  function showImage(data) {
    imgData = data;
    photoImg.onload = function () { imgRatio = clamp(photoImg.naturalWidth / photoImg.naturalHeight, 0.4, 2.5); };
    photoImg.src = data;
    photoImg.hidden = false; photoEmpty.hidden = true; photoTools.hidden = false;
    photo.classList.add('has-img');
  }
  function clearImage() {
    imgData = null; imgRatio = 1;
    photoImg.removeAttribute('src'); photoImg.hidden = true;
    photoEmpty.hidden = false; photoTools.hidden = true;
    photo.classList.remove('has-img');
    photoInput.value = '';
    write(IMG_KEY, null);
  }
  function loadFile(file) {
    if (!file) return;
    if (file.type && file.type.indexOf('image/') !== 0) {
      setStatus('그림 파일만 올릴 수 있어요. JPG나 PNG 그림을 골라 주세요.', true); return;
    }
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var s = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.naturalWidth * s));
      c.height = Math.max(1, Math.round(im.naturalHeight * s));
      var x = c.getContext('2d');
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var data = c.toDataURL('image/jpeg', 0.88);
      showImage(data);
      setStatus(write(IMG_KEY, data)
        ? '그림을 올렸어요.'
        : '그림을 올렸어요. 이 기기에 저장하지는 못해서, 새로 고치면 다시 올려야 해요.');
    };
    im.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus('이 파일은 열 수 없어요. JPG나 PNG 그림으로 다시 올려 주세요.', true);
    };
    im.src = url;
  }
  photoInput.addEventListener('change', function () { loadFile(photoInput.files && photoInput.files[0]); });
  $('changeBtn').addEventListener('click', function () { photoInput.click(); });
  $('removeBtn').addEventListener('click', function () { clearImage(); setStatus('그림을 지웠어요.'); });
  ['dragenter', 'dragover'].forEach(function (t) {
    photo.addEventListener(t, function (e) { e.preventDefault(); photo.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    photo.addEventListener(t, function (e) { e.preventDefault(); photo.classList.remove('over'); });
  });
  photo.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
        e.preventDefault(); loadFile(items[i].getAsFile()); return;
      }
    }
  });
  (function restoreImage() { var d = read(IMG_KEY); if (d && d.indexOf('data:image/') === 0) showImage(d); })();

  /* ---- 처음부터 다시 ---- */
  var resetBtn = $('resetBtn'), resetAsk = $('resetAsk');
  function askReset(on) { resetBtn.hidden = on; resetAsk.hidden = !on; }
  resetBtn.addEventListener('click', function () { askReset(true); $('resetNo').focus(); });
  $('resetNo').addEventListener('click', function () { askReset(false); resetBtn.focus(); });
  $('resetYes').addEventListener('click', function () {
    ids.forEach(function (id) { $(id).value = ''; });
    write(KEY, null); clearImage(); askReset(false);
    setStatus('모두 지웠어요. 새로 시작해 보세요.');
  });

  /* ---- 완성 카드 그리기: A4 가로(297 x 210mm), 150dpi = 1754 x 1240 ---- */
  var P = { sky: '#E6F1FA', paper: '#FFFFFF', tint: '#F3F8FD', ink: '#17264A', soft: '#55668A',
            line: '#C6D7EA', sun: '#FFC42E', leaf: '#17876A', badge: '#2456C8' };
  var F_DISPLAY = '"Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  var F_BODY = '"Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function wrapLines(ctx, text, maxW) {
    var out = [];
    String(text).replace(/\r/g, '').split('\n').forEach(function (para) {
      var line = '';
      para.split(' ').forEach(function (word) {
        var tryLine = line ? line + ' ' + word : word;
        if (ctx.measureText(tryLine).width <= maxW) { line = tryLine; return; }
        if (line) { out.push(line); line = ''; }
        for (var i = 0; i < word.length; i++) {       // 한 낱말이 줄보다 길면 글자 단위로 나눔
          if (ctx.measureText(line + word[i]).width > maxW && line) { out.push(line); line = ''; }
          line += word[i];
        }
      });
      out.push(line);
    });
    return out;
  }
  function drawFitted(ctx, text, x, y, w, h) {
    var size = 44, lines, lh;
    for (; size >= 22; size -= 2) {
      ctx.font = size + 'px ' + F_BODY; lh = size * 1.55;
      lines = wrapLines(ctx, text, w);
      if (lines.length * lh <= h) break;
    }
    if (size < 22) { size = 22; ctx.font = size + 'px ' + F_BODY; lh = size * 1.55; lines = wrapLines(ctx, text, w); }
    var max = Math.max(1, Math.floor(h / lh));
    if (lines.length > max) { lines = lines.slice(0, max); lines[max - 1] = lines[max - 1].replace(/.{0,2}$/, '…'); }
    ctx.fillStyle = P.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    lines.forEach(function (ln, i) { ctx.fillText(ln, x, y + lh * i + size); });
  }
  function fitOneLine(ctx, text, family, start, min, maxW) {
    var s = start;
    for (; s > min; s -= 2) { ctx.font = s + 'px ' + family; if (ctx.measureText(text).width <= maxW) break; }
    ctx.font = s + 'px ' + family;
  }
  function drawCard() {
    var W = 1754, H = 1240, c = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');
    var v = {}; ids.forEach(function (id) { v[id] = $(id).value.trim(); });
    var L = 84, R = W - 84, top = 190, bottom = H - 84, colH = bottom - top;   // 두 칸이 함께 쓰는 위·아래 선

    ctx.fillStyle = P.sky; ctx.fillRect(0, 0, W, H);
    rr(ctx, 36, 36, W - 72, H - 72, 40); ctx.fillStyle = P.paper; ctx.fill();

    // 제목
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = '72px ' + F_DISPLAY;
    var tw = ctx.measureText('소중한 나의 꿈').width;
    ctx.fillStyle = P.sun; ctx.fillRect(W / 2 - tw / 2 - 6, 120, tw + 12, 28);
    ctx.fillStyle = P.ink; ctx.fillText('소중한 나의 꿈', W / 2, 144);

    // 왼쪽: 미래 나의 모습
    var bx = L, by = top, bw = 800, bh = colH;
    ctx.save(); rr(ctx, bx, by, bw, bh, 32); ctx.clip();
    ctx.fillStyle = P.tint; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = P.badge; ctx.fillRect(bx, by, bw, 88);
    ctx.restore();
    rr(ctx, bx, by, bw, bh, 32); ctx.lineWidth = 4; ctx.strokeStyle = P.ink; ctx.stroke();
    ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center';
    ctx.font = '40px ' + F_DISPLAY; ctx.fillText('미래 나의 모습', bx + bw / 2, by + 59);

    var rx = bx + 30, ry = by + 112, rw = bw - 60, rh = bh - 112 - 160, pw, ph;
    if (imgData && photoImg.naturalWidth) {
      if (rw / imgRatio <= rh) { pw = rw; ph = rw / imgRatio; } else { ph = rh; pw = rh * imgRatio; }
      var px = rx + (rw - pw) / 2, py = ry + (rh - ph) / 2;
      ctx.save(); rr(ctx, px, py, pw, ph, 24); ctx.clip();
      ctx.drawImage(photoImg, px, py, pw, ph);
      ctx.restore();
      rr(ctx, px, py, pw, ph, 24); ctx.lineWidth = 4; ctx.strokeStyle = P.ink; ctx.stroke();
    } else {
      rr(ctx, rx, ry, rw, rh, 24); ctx.fillStyle = P.paper; ctx.fill();
      ctx.setLineDash([14, 12]); ctx.lineWidth = 4; ctx.strokeStyle = P.line; ctx.stroke(); ctx.setLineDash([]);
    }
    var jobY = by + bh - 92, nameY = by + bh - 32;
    ctx.fillStyle = P.ink; ctx.textAlign = 'center';
    fitOneLine(ctx, v.jobName || ' ', F_DISPLAY, 58, 30, rw);
    ctx.fillText(v.jobName, bx + bw / 2, jobY);
    ctx.fillStyle = P.soft;
    fitOneLine(ctx, v.studentName || ' ', F_BODY, 38, 24, rw);
    ctx.fillText(v.studentName, bx + bw / 2, nameY);
    ctx.fillStyle = P.line;
    if (!v.jobName) ctx.fillRect(bx + 220, jobY + 2, bw - 440, 3);
    if (!v.studentName) ctx.fillRect(bx + 280, nameY + 2, bw - 560, 3);

    // 오른쪽: 조사 두 칸 (왼쪽 칸과 위·아래 선이 같다)
    var nx = bx + bw + 46, nw = R - nx, gap = 40, blockH = (colH - gap) / 2, pillH = 58, boxH = blockH - pillH - 16;
    function block(y, label, fill, labelInk, text) {
      ctx.font = '34px ' + F_DISPLAY; ctx.textAlign = 'left';
      var lw = ctx.measureText(label).width + 56;
      rr(ctx, nx, y, lw, pillH, pillH / 2); ctx.fillStyle = fill; ctx.fill();
      ctx.fillStyle = labelInk; ctx.fillText(label, nx + 28, y + 41);
      var boxY = y + pillH + 16;
      rr(ctx, nx, boxY, nw, boxH, 22); ctx.fillStyle = P.paper; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = P.ink; ctx.stroke();
      if (text) drawFitted(ctx, text, nx + 28, boxY + 18, nw - 56, boxH - 44);
    }
    block(top, '직업이 하는 일', P.sun, P.ink, v.jobWork);
    block(top + blockH + gap, '꿈을 이루기 위한 방법', P.leaf, '#FFFFFF', v.dreamPath);
    return c;
  }
  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.all([document.fonts.load('40px "Jua"', '미래'), document.fonts.load('38px "Gowun Dodum"', '미래')])
      .catch(function () {});
  }

  /* ---- 이미지로 저장 ---- */
  var saveBtn = $('saveBtn'), lastUrl = null;
  saveBtn.addEventListener('click', function () {
    if (!STANDALONE && !downloads) return;
    saveBtn.disabled = true;
    fontsReady().then(function () {
      var c = drawCard();
      return new Promise(function (res, rej) {
        c.toBlob(function (b) { b ? res(b) : rej({ code: 'bad_request' }); }, 'image/png');
      });
    }).then(function (blob) {
      if (STANDALONE) {
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = lastUrl; a.download = 'future-me-card.png';
        document.body.appendChild(a); a.click(); a.remove();
        return null;
      }
      var who = $('studentName').value.trim().replace(/[\\\/:*?"<>|.]/g, '');
      return downloads.save({ filename: '소중한 나의 꿈' + (who ? ' ' + who : '') + '.png', data: blob });
    }).then(function () {
      setStatus(STANDALONE ? '이미지를 내려받았어요. 이제 패들렛에 올려요.' : '카드를 이미지로 저장했어요. 이제 패들렛에 올려요.');
    }).catch(function (e) {
      var code = e && e.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') { setStatus('저장 창이 이미 열려 있어요. 잠시 뒤에 다시 눌러 주세요.', true); return; }
      if (STANDALONE || code === 'bad_request' || code === 'transform_error' || code === 'too_large') {
        setStatus('저장하지 못했어요. 카드 그림을 길게 눌러 저장하거나, 화면을 캡처해 주세요.', true); return;
      }
      saveBtn.hidden = true; downloads = null; helpText();
      setStatus('이 화면에서는 이미지로 저장할 수 없어요. 화면을 캡처해서 올려요.', true);
    }).then(function () { saveBtn.disabled = false; });
  });

  /* ---- 완성 카드 화면 ---- */
  var done = $('done'), doneBtn = $('doneBtn');
  function helpText() {
    $('doneHelp').textContent = (STANDALONE || downloads)
      ? '‘이미지로 저장’을 누르고, 저장한 이미지를 패들렛에 올려요. 저장이 안 되면 화면을 캡처해서 올려요.'
      : '이 화면을 캡처해서, 캡처한 이미지를 패들렛에 올려요.';
  }
  function closeDone() { done.hidden = true; doneBtn.focus(); }
  doneBtn.addEventListener('click', function () {
    fontsReady().then(function () {
      $('doneImg').src = drawCard().toDataURL('image/png');
      var empty = [];
      if (!imgData) empty.push('그림');
      [['jobName', '미래의 직업'], ['studentName', '이름'], ['jobWork', '직업이 하는 일'], ['dreamPath', '꿈을 이루기 위한 방법']]
        .forEach(function (f) { if (!$(f[0]).value.trim()) empty.push(f[1]); });
      var m = $('doneMissing');
      m.hidden = !empty.length;
      m.textContent = empty.length ? '아직 비어 있는 칸이 있어요: ' + empty.join(', ') : '';
      helpText(); $('doneStatus').textContent = '';
      done.hidden = false; $('doneClose').focus();
    });
  });
  $('doneClose').addEventListener('click', closeDone);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !done.hidden) closeDone(); });

  if (STANDALONE) {
    saveBtn.hidden = false;
  } else {
    window.claude.use('downloads').then(function (d) { if (d) { downloads = d; saveBtn.hidden = false; helpText(); } })
      .catch(function () {});
  }
})();
</script>
</body>
